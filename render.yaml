# Render blueprint for the Afterword API (server/). The website (client/) deploys on Vercel.
# Fits the free plan: transcription runs on Groq and embeddings on Mistral (no PyTorch).
services:
  - type: web
    name: afterword-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://afterword-.*\.vercel\.app
      - key: TRANSCRIBE_ENGINE
        value: groq
      - key: EMBEDDINGS
        value: mistral
